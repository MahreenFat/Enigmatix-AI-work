<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enigmatix Candy Crush</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="top-bar">
        <div>
          <p class="eyebrow">Modern Match-3</p>
          <h1>Enigmatix Candy Crush</h1>
        </div>
        <div class="status-pills">
          <div class="pill">
            <span id="levelValue">1</span>
            <small>Level</small>
          </div>
          <div class="pill">
            <span id="scoreValue">0</span>
            <small>Score</small>
          </div>
          <div class="pill">
            <span id="movesValue">20</span>
            <small>Moves</small>
          </div>
        </div>
      </header>

      <main class="game-layout">
        <section class="panel board-panel">
          <div id="board" class="board" aria-label="Candy board"></div>
        </section>

        <aside class="panel info-panel">
          <h2>How to play</h2>
          <p>Swap adjacent fruits to create 3 or more in a row or column.</p>

          <div class="legend" aria-label="Fruit colors">
            <div class="legend-item"><span class="dot pink"></span>Strawberry</div>
            <div class="legend-item"><span class="dot orange"></span>Orange</div>
            <div class="legend-item"><span class="dot cyan"></span>Lemon</div>
            <div class="legend-item"><span class="dot purple"></span>Grape</div>
            <div class="legend-item"><span class="dot green"></span>Apple</div>
            <div class="legend-item"><span class="dot red"></span>Cherry</div>
          </div>

          <div class="controls">
            <button id="newGameBtn">New Game</button>
            <button id="shuffleBtn" class="secondary">Shuffle</button>
          </div>

          <div class="message-card">
            <h3>Level Goal</h3>
            <p id="messageText">Create cascading combos and chase the highest score.</p>
            <div class="progress-box">
              <div class="progress-meta">
                <span>Target</span>
                <span id="targetValue">300</span>
              </div>
              <div class="progress-bar">
                <div id="progressFill" class="progress-fill"></div>
              </div>
            </div>
          </div>
        </aside>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
